id: merrjep_ks_real_estate
site: MerrJep Kosovo
category: real_estate     # MUST match folder name (configs/real_estate/)
country: XK
base_url: https://www.merrjep.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
js_rendered: false
# Container/title/price selectors are the same site-wide (shared with cars,
# confirmed live). Breadcrumb depth for real estate is CONFIRMED as only 2
# links (property type, city) — different from cars' 4. robots.txt: Allow: /.
#
# VERIFIED: live `inspect` run returned 55 clean records — sales vs. rentals
# correctly split via price_period, property_type/city correctly extracted
# from the breadcrumb, empty prices correctly handled.
selectors_verified: true

# Lists apartments, houses, and land together in one feed — property_type
# (from the breadcrumb) tells them apart, so one crawl covers all three and
# every city; no need for separate per-type or per-city runs.
start_paths:
  - /shpallje/patundshmeri     # confirmed live path

pagination:
  mode: query_param
  param: page          # ASSUMED same scheme as cars — verify by clicking to
                        # page 2 in your browser and checking the URL matches
  start: 1
  max_pages: 50         # raised: you want "everything" — override with --pages

listing_selector: "div.row-listing[data-product-id]"

external_id:
  attr: data-product-id

fields:
  title:
    selector: "h2 a.Link_vis"
  url:
    selector: "h2 a.Link_vis"
    attr: href
  price:
    selector: "p.list-price"   # often empty; rentals end in "/ muaj"
  price_kind:
    const: asking_price        # NEVER a confirmed transaction — sale or rent alike
  price_period:
    selector: "p.list-price"
    regex: "(muaj)"            # present => rental (per month); absent => one-time sale
  # CONFIRMED live: real-estate breadcrumb is only 2 links, unlike cars' 4.
  property_type:
    selector: "div.title > a.link-html.nobold"
    index: 0
  city:
    selector: "div.title > a.link-html.nobold"
    index: -1        # last breadcrumb link = city (robust even if depth changes)
  is_dealer:
    selector: "span.label.label-default.isstore"
    exists: true
  is_trusted_seller:
    selector: "span.badge-trusted-seller"
    exists: true

notes: >
  One crawl of /shpallje/patundshmeri returns apartments, houses, and land for
  every city at once; slice by attributes.property_type and city afterward —
  do not run this once per city. Rentals are detected via "/ muaj" in the price
  text (attributes.price_period == "muaj"); sales leave price_period unset. All
  prices are asking prices, never confirmed transactions (attributes.price_kind
  == "asking_price"), rent or sale alike. Pagination param is assumed, not
  independently reconfirmed — verify before a very large run.
