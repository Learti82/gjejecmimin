id: barnatore
site: Barnatore Online (Kosovo pharmacy)
category: pharmacy
country: XK
base_url: https://www.barnatoreonline-ks.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# robots.txt clean (Allow: /). ToS page short, no anti-scraping language found.
# CONFIRMED JS-rendered — a live `discover` run through headless Chromium
# found 35 real products at /shop, proving the URL and the rendering approach.
js_rendered: true
selectors_verified: false      # one more `inspect` run with these fixed
                                # selectors, then flip this to true

start_paths:
  - /shop     # confirmed live: 35 products found here

pagination:
  mode: query_param
  param: page      # UNCONFIRMED — verify by paging manually
  start: 1
  max_pages: 20

# CORRECTED from a live discover run — the earlier .single_product guess was
# wrong; the real container is figcaption.product_content.
listing_selector: "figcaption.product_content"

# The card has TWO <a> tags: the real product link, and a "+ Shto në shportë"
# (add to cart) button with href="#" — target only the product link.
external_id:
  selector: "a[href*='product-details']"
  attr: href
  regex: "product=([^&]+)"     # e.g. "nicorette-fresh-mint-4-mg-"

fields:
  title:
    selector: "h4.product_name"
  url:
    selector: "a[href*='product-details']"
    attr: href
  price:
    selector: "span.current_price"   # span.old_price is the pre-discount strikethrough

notes: >
  Live discover run at /shop found: container figcaption.product_content
  (x35), title h4.product_name, price span.current_price (span.old_price on
  ~3/35 cards is the strikethrough pre-discount price, correctly not used).
  JS-rendered — inspect/run automatically use browser_client.py. Run
  `inspect barnatore --pages 1` to confirm titles/prices look right before
  flipping selectors_verified.
