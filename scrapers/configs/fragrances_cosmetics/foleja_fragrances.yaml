id: foleja_fragrances
site: Foleja (Kosovo retailer)
category: fragrances_cosmetics
country: XK
base_url: https://www.foleja.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
js_rendered: false      # confirmed: plain requests found 48 real product cards
selectors_verified: false      # one more `inspect` run, then flip this to true

start_paths:
  - /Kozmetike-Kujdesi-Personal/Parfum/    # confirmed live: 48 products found

pagination:
  mode: query_param
  param: page                  # VERIFY (Foleja may use a path-based pager)
  start: 1
  max_pages: 30

# From a live discover run.
listing_selector: "div.product-info"

# The URL is https://www.foleja.com/YLL-200014008/Eau-de-Parfum — the FIRST
# path segment (YLL-200014008) is the real SKU; the trailing segment is just a
# generic name-based slug that different products could share. Capture the
# SKU, not the last segment.
external_id:
  selector: "a.product-name"
  attr: href
  regex: "foleja\\.com/([^/?#]+)"

fields:
  title:
    selector: "a.product-name"
  url:
    selector: "a.product-name"
    attr: href
  # ⚠️ UNCERTAIN — discover found TWO different price-looking selectors on the
  # page in equal counts (24 each out of 48 cards): span.whole-original-price
  # and span.list-price-price. This usually means "on sale" cards show a
  # struck-through original price PLUS the current price, while regular cards
  # show only one. Best guess: list-price-price is the price the customer
  # actually pays (whole-original-price sounds like the pre-discount
  # reference). CONFIRM this by opening a product on the site yourself and
  # checking which number matches what's shown as the real price — then run
  # `inspect foleja_fragrances --pages 1` and check the sample prices look
  # sane before trusting this.
  price:
    selector: "span.list-price-price"

notes: >
  Foleja also sells electronics/appliances — separate configs per category if
  you add those. Price selector needs a visual double-check (see comment
  above) before flipping selectors_verified.
