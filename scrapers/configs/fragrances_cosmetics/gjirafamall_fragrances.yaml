id: gjirafamall_fragrances
site: GjirafaMall (Kosovo marketplace)
category: fragrances_cosmetics
country: XK
base_url: https://gjirafamall.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# CONFIRMED server-rendered (discover saw 30 products via plain requests) and
# robots.txt ALLOWED. Selectors below are from a live discover run.
js_rendered: false
selectors_verified: false      # flip to true after `inspect` looks right

start_paths:
  - /parfum
  - /aroma-kozmetike

pagination:
  mode: query_param
  param: page                  # VERIFY: open page 2 in a browser and read the URL
  start: 1
  max_pages: 5

listing_selector: "section.details.flex.flex-col.h-full.justify-end.pb-2"

# Stable id from the product URL's last path segment (unique per product, and
# dedups the same product appearing under /parfum and /aroma-kozmetike).
external_id:
  selector: "a.text-gray-800"
  attr: href
  regex: "([^/?#]+)/?$"

fields:
  title:
    selector: "h3.product-title"
  url:
    selector: "a.text-gray-800"
    attr: href
  price:
    selector: "span.price:not(.old-price)"   # current price, skips strikethrough

notes: >
  Selectors verified against a fixture built from the live discover output.
  Run `inspect gjirafamall_fragrances --pages 1`; when real perfume names +
  EUR prices show, set selectors_verified: true. The card wrapper also carries
  data-productid / data-discountedprice if you later prefer an attribute id.
