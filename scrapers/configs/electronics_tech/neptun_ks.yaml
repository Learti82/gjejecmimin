id: neptun_ks
site: Neptun Kosovo (electronics)
category: electronics_tech
country: XK
base_url: https://www.neptun-ks.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# ⛔ SKIP RECOMMENDED — DO NOT BUILD FURTHER.
# robots.txt contains an explicit `User-agent: ClaudeBot / Disallow: /` rule
# (alongside GPTBot, CCBot, Google-Extended, etc.) — a direct site-owner signal
# against Claude-based access specifically. This engine's own User-Agent is
# named "GjejeCmiminBot" (not "ClaudeBot"), so a naive robots.txt check would
# technically report ALLOWED — but the intent of that rule is unambiguous, and
# it should be honored in spirit, not routed around on a technicality. Left as
# an unverified template; do not fill in selectors or run this config.
js_rendered: false
selectors_verified: false

start_paths:
  - /                        # replace with a real catalog/category path

pagination:
  mode: query_param
  param: page
  start: 1
  max_pages: 5

listing_selector: "REPLACE_ME"
external_id:
  selector: "REPLACE_ME"
  attr: null
fields:
  title:
    selector: "REPLACE_ME"
  url:
    selector: "REPLACE_ME"
    attr: href
  price:
    selector: "REPLACE_ME"

notes: >
  Confirm online catalog + prices exist before building. If marketing-only,
  report and skip per build spec section 2.
