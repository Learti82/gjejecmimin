id: gjirafa50
site: Gjirafa50 (Kosovo electronics)
category: electronics_tech
country: XK
base_url: https://gjirafa50.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# robots.txt is permissive (nopCommerce, only admin/checkout paths blocked).
# Selectors confirmed live: container .product-item, title
# a.product-title-lines, price span.price.main / span.price.old-price.
js_rendered: false
selectors_verified: false      # confirm with `inspect` before flipping

# ⚠️ FLAGGED, NOT YET RESOLVED: same parent company as GjirafaMall, and its
# Terms of Use carry the identical boilerplate — explicitly bans automated/bot
# access and data-extraction tools. `run` refuses this config until you decide
# and pass --acknowledge-tos-risk. See gjirafamall_fragrances for the full quote.
tos_restricted: true
tos_note: >
  Gjirafa50 shares Gjirafa's company-wide Terms of Use, which explicitly
  prohibit automated/bot access and data-extraction tools (same clause as
  GjirafaMall).

start_paths:
  - /                        # replace with an actual category/listing path

pagination:
  mode: query_param
  param: page
  start: 1
  max_pages: 30

listing_selector: ".product-item"
external_id:
  selector: "a.product-title-lines"
  attr: href
  regex: "([^/?#]+)/?$"
fields:
  title:
    selector: "a.product-title-lines"
  url:
    selector: "a.product-title-lines"
    attr: href
  price:
    selector: "span.price.main:not(.old-price)"

notes: >
  Selectors confirmed live but not yet run against a real page — confirm with
  `inspect gjirafa50 --pages 1` (this still works despite tos_restricted; only
  `run` is gated) before flipping selectors_verified.
