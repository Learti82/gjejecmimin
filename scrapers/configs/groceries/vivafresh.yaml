id: vivafresh
site: Viva Fresh Store (Kosovo groceries)
category: groceries
country: XK
base_url: https://online.vivafresh.shop
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# CONFIRMED JS-rendered: the homepage and /categories only ever show an empty
# cart-icon shell (categories are likely browsed via client-side JS, not
# separate crawlable URLs). A live discover run against a /product?id=...
# page — through headless Chromium — found a real 135-item product grid, so
# that's the entry point instead of a "category" page.
js_rendered: true
selectors_verified: false      # one more `inspect` run, then flip this to true

# A single real, confirmed product page. Its rendered DOM includes a broad
# catalog/related-items grid (135 real priced products in the live test) —
# this is a best-effort snapshot of whatever that widget shows, NOT a full
# category crawl (the site doesn't expose separate category URLs we could
# find). Good enough to get real grocery data flowing; a true full-catalog
# crawl would need the site's internal category API, out of scope for now.
start_paths:
  - /product?id=1227607

pagination:
  mode: none    # single confirmed entry point — see note above
  max_pages: 1

listing_selector: "div.product-box"

# Cleaner than parsing the URL: the card carries a real numeric id directly.
# selector: null reads the attribute off the listing element itself, not a
# (nonexistent) nested descendant.
external_id:
  selector: null
  attr: data-id

fields:
  title:
    selector: "p.title"
  url:
    selector: "a.product-link"
    attr: href
  # ⚠️ UNCERTAIN — discover found two price-like classes: p.bigprice (x77) and
  # p.smallprice (x58) on 135 total cards, which doesn't cleanly split into
  # "every card has one, some have both" the way GjirafaMall/Barnatore's
  # current/old-price pairs did. Best guess: bigprice is the prominent/current
  # price. CONFIRM by opening a couple of these products on the site and
  # checking which number is the actual price before trusting this.
  price:
    selector: "p.bigprice"

notes: >
  Container/title/price/id all confirmed against a real live render (135
  products, e.g. "Vaj per flok Pantene Repair&Protect 100m" with data-id
  1219887). Price selector needs a visual double-check (see comment above).
  Run `inspect vivafresh --pages 1` and eyeball the sample before flipping
  selectors_verified.
