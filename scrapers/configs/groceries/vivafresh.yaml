id: vivafresh
site: Viva Fresh Store (Kosovo groceries)
category: groceries
country: XK
base_url: https://online.vivafresh.shop
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# robots.txt clean (Crawl-delay: 1 — our engine's 2s floor already exceeds
# this). No anti-scraping language found.
#
# CONFIRMED JS-rendered: two different plain-request fetches (homepage and
# /categories) both returned only the same empty cart-icon shell — the real
# categories/products are injected client-side after load, same pattern as
# Barnatore. Needs the headless-browser client (automatic once this is true).
js_rendered: true
selectors_verified: false   # confirm with `discover`/`inspect` through the
                             # browser client, then flip this to true

start_paths:
  - /categories              # best current guess — confirm via a browser-rendered
                              # `discover` run; may need a deeper category URL

pagination:
  mode: query_param
  param: page                # UNCONFIRMED — verify by paging manually
  start: 1
  max_pages: 20

listing_selector: ".product-box"

external_id:
  selector: "a.product-link"
  attr: href
  regex: "([^/?#]+)/?$"      # stable id from the product URL's last segment

fields:
  title:
    selector: "a.product-link"
  url:
    selector: "a.product-link"
    attr: href
  price:
    selector: ".bigprice"

notes: >
  Container/title/price selectors (.product-box / a.product-link / .bigprice)
  are from earlier documentation, NOT yet independently confirmed against
  actual rendered content — two plain-request fetches only ever saw the empty
  shell, so they've never been tested against real product markup. Run
  `discover vivafresh` (now goes through headless Chromium automatically) to
  get a live card anatomy and correct these if needed, then
  `inspect vivafresh --pages 1` before flipping selectors_verified.
