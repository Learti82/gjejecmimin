id: vivafresh
site: Viva Fresh Store (Kosovo groceries)
category: groceries
country: XK
base_url: https://online.vivafresh.shop
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
# robots.txt clean (Crawl-delay: 1 — our engine's 2s floor already exceeds
# this). Real priced catalog confirmed; container/title/price selectors below
# are confirmed live. No anti-scraping language found.
js_rendered: false          # VERIFY (compare source vs rendered DOM)
selectors_verified: false   # one thing left: a real category/listing URL below

start_paths:
  - /                        # STILL A PLACEHOLDER — replace with a real
                              # category/listing path (e.g. a "Produkte" or
                              # search-results URL), then run `inspect`

pagination:
  mode: query_param
  param: page                # UNCONFIRMED — verify by paging manually
  start: 1
  max_pages: 20

listing_selector: ".product-box"

external_id:
  selector: "a.product-link"
  attr: href
  regex: "([^/?#]+)/?$"      # stable id from the product URL's last segment

fields:
  title:
    selector: "a.product-link"
  url:
    selector: "a.product-link"
    attr: href
  price:
    selector: ".bigprice"

notes: >
  Container/title/price selectors confirmed live (.product-box / a.product-link
  / .bigprice). Still missing: a real category/listing start_path — replace the
  "/" placeholder with an actual products URL, then run
  `inspect vivafresh --pages 1` and confirm before flipping selectors_verified.
