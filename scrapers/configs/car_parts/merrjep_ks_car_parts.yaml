id: merrjep_ks_car_parts
site: MerrJep Kosovo
category: car_parts       # MUST match folder name (configs/car_parts/)
country: XK
base_url: https://www.merrjep.com
trust_tier: verified_retailer
default_currency: EUR
rate_limit_seconds: 2.0
js_rendered: false
# VERIFIED: live inspect run returned 51 clean records. Breadcrumb is only
# 2 links (category, city) — like real estate, NOT the 4-link cars pattern.
# (A first attempt with index 1 = "part_type" actually pulled city names —
# fixed below using the same index:0 / index:-1 pattern as real estate.)
selectors_verified: true

start_paths:
  - /shpallje/makina/autopjese-pajisje   # confirmed live path

pagination:
  mode: query_param
  param: page
  start: 1
  max_pages: 30

listing_selector: "div.row-listing[data-product-id]"

external_id:
  attr: data-product-id

fields:
  title:
    selector: "h2 a.Link_vis"
  url:
    selector: "h2 a.Link_vis"
    attr: href
  price:
    selector: "p.list-price"   # often empty — most part listings are contact-only
  part_category:
    selector: "div.title > a.link-html.nobold"
    index: 0
  city:
    selector: "div.title > a.link-html.nobold"
    index: -1        # last breadcrumb link = city (robust even if depth changes)
  is_dealer:
    selector: "span.label.label-default.isstore"
    exists: true
  is_trusted_seller:
    selector: "span.badge-trusted-seller"
    exists: true

notes: >
  Placeholder-price filtering confirmed live: "SHTROJE GOME TOYOTA RAW 4" listed
  at "1 EUR" — correctly dropped by the price parser (parse_price treats exact
  value 1 as the no-price placeholder). Most listings in this category have no
  price at all (contact-only) — that's expected marketplace behavior, not a
  bug. The specific part type (tires, brakes, etc.) isn't broken out in the
  breadcrumb — only in the free-text title — so filter/search by title text if
  you need that; part_category is whatever generic label the site puts first.
