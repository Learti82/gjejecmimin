<!--
  Vivafresh card markup, reconstructed from a live discover run through
  headless Chromium (a /product?id=... page rendering a broad product grid):
  container div.product-box with a data-id attribute (cleaner id source than
  parsing the URL), title p.title, link a.product-link, price p.bigprice
  (p.smallprice appears on some cards — meaning unconfirmed, see config note).
-->
<html><body>
<div class="catalog">

  <div class="product-box" data-id="1219887" data-product-name="Vaj per flok Pantene Repair&amp;Protect 100m">
    <a class="product-link" href="/product?id=1219887">-32% Vaj per flok Pantene Repair&amp;Protect 100m</a>
    <p class="title">Vaj per flok Pantene Repair&amp;Protect 100m</p>
    <p class="smallprice">2.99 €</p>
    <p class="bigprice">1.99 €</p>
  </div>

  <div class="product-box" data-id="1232595" data-product-name="Qumesht Liofilizat 1L">
    <a class="product-link" href="/product?id=1232595">Qumesht Liofilizat 1L</a>
    <p class="title">Qumesht Liofilizat 1L</p>
    <p class="bigprice">1.05 €</p>
  </div>

</div>
</body></html>
