<!--
  Barnatore card markup, reconstructed from a live discover run through
  headless Chromium: container figcaption.product_content, title
  h4.product_name, TWO <a> tags per card (real product link + "add to cart"
  button with href="#" — must not be confused), price span.current_price
  with span.old_price as the pre-discount strikethrough on some cards.
-->
<html><body>
<div class="products">

  <div class="product_box">
    <figcaption class="product_content">
      <h4 class="product_name">NICORETTE FRESH MINT 4 MG A30</h4>
      <a href="product-details?product=nicorette-fresh-mint-4-mg-">View</a>
      <a href="#">+ Shto në shportë</a>
      <span class="current_price">4.50 €</span>
    </figcaption>
  </div>

  <div class="product_box">
    <figcaption class="product_content">
      <h4 class="product_name">VICHY NORMADERM 200ML</h4>
      <a href="product-details?product=vichy-normaderm-200ml">View</a>
      <a href="#">+ Shto në shportë</a>
      <span class="old_price">18.00 €</span>
      <span class="current_price">14.99 €</span>
    </figcaption>
  </div>

</div>
</body></html>
